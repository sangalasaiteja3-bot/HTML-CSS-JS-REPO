<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript Experiment 62</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033;line-height:1.55}.wrap{width:min(1100px,92%);margin:28px auto}.topnav{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px}.topnav a{color:#2563eb;text-decoration:none;font-weight:700}.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 30px rgba(15,23,42,.08)}h1{margin-top:0;font-size:clamp(28px,4vw,42px)}h2{color:#1d4ed8}button,.btn{border:0;border-radius:9px;background:#2563eb;color:#fff;padding:10px 16px;cursor:pointer;font-weight:700}button:hover,.btn:hover{background:#1d4ed8}input,select,textarea{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px}.demo{margin-top:22px;padding:24px;background:#eff6ff;border-radius:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.muted{color:#64748b}.result{margin-top:15px;padding:12px;background:#ecfdf5;border-radius:8px}.error{color:#b91c1c;font-weight:700}.item{padding:14px;margin:9px 0;background:#fff;border-radius:11px;box-shadow:0 3px 12px rgba(15,23,42,.06)}.item a{text-decoration:none;color:#1d4ed8;font-weight:650}@media(max-width:650px){.card{padding:20px}}</style></head><body><main class="wrap"><nav class="topnav"><a href="../../index.html">Home</a><a href="../../javascript/index.html">Back to Programs</a></nav><section class="card"><h1>JavaScript Experiment 62</h1><p class="muted">Write a program to count the number of words in a string.</p><div class="demo"><input id="txt" value="JavaScript is fun"><button id="run">Run</button><p id="out"></p></div></section></main><script>run.onclick=()=>{let s=document.getElementById('txt').value;out.textContent=`Length: ${s.length} | Upper: ${s.toUpperCase()} | Words: ${s.trim()?s.trim().split(/\s+/).length:0}`};</script></body></html>
